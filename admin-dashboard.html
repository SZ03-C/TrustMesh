<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrustMesh - Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
      .admin-header h1 { margin: 0; font-size: 1.4rem; }
      .admin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
      .admin-stat { padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: rgba(16,24,32,0.82); text-align: center; }
      .admin-stat strong { display: block; font-size: 1.8rem; }
      .admin-stat span { font-size: 0.75rem; color: var(--muted); }
      .stat-pending strong { color: #e6a817; }
      .stat-approved strong { color: var(--green); }
      .stat-denied strong { color: var(--red); }
      .stat-total strong { color: var(--cyan); }

      .section-label { font-size: 0.65rem; color: #4a7a5a; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; font-weight: 700; }

      .req-card {
        border: 1px solid var(--line); border-radius: 10px; background: rgba(16,24,32,0.82);
        padding: 20px; margin-bottom: 12px; position: relative; overflow: hidden;
        transition: border-color 0.2s;
      }
      .req-card:hover { border-color: rgba(57,255,136,0.2); }
      .req-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
      .req-card.pending::before { background: #e6a817; }
      .req-card.approved::before { background: var(--green); }
      .req-card.denied::before { background: var(--red); }

      .req-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
      .req-org { font-size: 1.05rem; font-weight: 800; color: var(--text); }
      .req-badge { font-size: 0.68rem; font-weight: 800; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; }
      .badge-pending { background: rgba(230,168,23,0.12); color: #e6a817; border: 1px solid rgba(230,168,23,0.25); }
      .badge-approved { background: rgba(57,255,136,0.12); color: var(--green); border: 1px solid rgba(57,255,136,0.25); }
      .badge-denied { background: rgba(255,68,102,0.12); color: var(--red); border: 1px solid rgba(255,68,102,0.25); }

      .req-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
      .req-field label { display: block; font-size: 0.62rem; color: #4a7a5a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
      .req-field span { font-size: 0.85rem; color: #b8d8c8; font-weight: 600; }

      .req-msg { padding: 10px 14px; background: #071017; border-radius: 6px; border: 1px solid #1a2a22; margin-bottom: 14px; font-size: 0.85rem; color: var(--muted); line-height: 1.5; font-style: italic; }
      .req-msg::before { content: '"'; color: #3a6a4a; }
      .req-msg::after { content: '"'; color: #3a6a4a; }

      .req-actions { display: flex; gap: 10px; }
      .btn-approve { background: var(--green); color: #031008; font-weight: 800; border: 0; border-radius: 6px; padding: 10px 24px; cursor: pointer; font-size: 0.88rem; }
      .btn-approve:hover { filter: brightness(1.08); }
      .btn-deny { background: transparent; color: var(--red); font-weight: 700; border: 1px solid rgba(255,68,102,0.25); border-radius: 6px; padding: 10px 24px; cursor: pointer; font-size: 0.88rem; }
      .btn-deny:hover { background: rgba(255,68,102,0.08); }

      .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
      .empty-state h3 { color: var(--text); margin-bottom: 6px; }

      .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
      .tab { padding: 10px 20px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; border-radius: 8px 8px 0 0; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
      .tab:hover { border-color: rgba(57,255,136,0.2); color: var(--text); }
      .tab.active { background: rgba(11,16,22,0.8); border-color: var(--line); border-bottom-color: rgba(11,16,22,0.8); color: var(--green); }
      .tab-content { display: none; }
      .tab-content.active { display: block; border: 1px solid var(--line); border-radius: 0 8px 8px 8px; background: rgba(11,16,22,0.8); padding: 20px; }

      .table-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
      .table-nav button { padding: 6px 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; border-radius: 6px; font-size: 0.78rem; transition: all 0.2s; }
      .table-nav button:hover { border-color: rgba(57,255,136,0.2); color: var(--text); }
      .table-nav button.active { background: rgba(57,255,136,0.08); border-color: rgba(57,255,136,0.25); color: var(--green); }

      .db-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
      .db-table th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
      .db-table td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #b8d8c8; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .db-table tr:hover td { background: rgba(57,255,136,0.03); }
      .db-table .row-count { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }

      @media (max-width: 600px) { .admin-stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-label="TrustMesh home"><span class="brand-mark">TM</span><span>TrustMesh</span></a>
        <div class="nav-actions">
          <a href="index.html">Dashboard</a>
          <a href="scanner.html">Scanner</a>
          <a href="passport.html">Passport</a>
          <a href="requests.html">Trust requests</a>
          <a class="active" href="admin.html">Admin</a>
          <a href="contact.html">Contact</a>
          <span class="nav-user" id="navUser"></span>
        </div>
      </nav>

      <div class="admin-header">
        <div>
          <p class="eyebrow">Admin panel</p>
          <h1>Administration</h1>
        </div>
        <div style="display:flex;gap:10px">
          <a class="button-link secondary-link" href="index.html" style="text-decoration:none">Dashboard</a>
          <button class="btn-deny" id="logoutBtn">Logout</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="requests">Trust Requests</button>
        <button class="tab" data-tab="db">Database</button>
      </div>

      <div class="tab-content active" id="tab-requests">
        <div class="admin-stats">
          <div class="admin-stat stat-pending"><strong id="sPending">0</strong><span>Pending</span></div>
          <div class="admin-stat stat-approved"><strong id="sApproved">0</strong><span>Approved</span></div>
          <div class="admin-stat stat-denied"><strong id="sDenied">0</strong><span>Denied</span></div>
          <div class="admin-stat stat-total"><strong id="sTotal">0</strong><span>Total</span></div>
        </div>
        <div id="requestsList"></div>
      </div>

      <div class="tab-content" id="tab-db">
        <div class="table-nav" id="tableNav"></div>
        <div id="dbContent"><div class="empty-state"><h3>Loading database...</h3></div></div>
      </div>

      <footer class="site-footer">
        <div class="footer-content">
          <div class="footer-brand"><span class="brand-mark">TM</span><span>TrustMesh</span></div>
          <p class="copyright">&copy; 2026 TrustMesh by Shaguftha Zabeen. All rights reserved.</p>
        </div>
      </footer>
    </main>

    <script>
    (function() {
      var token = localStorage.getItem("tm_token");
      var user = JSON.parse(localStorage.getItem("tm_user") || "null");
      var navUser = document.getElementById("navUser");

      if (!token || !user || user.role !== "admin") {
        window.location.href = "admin.html";
        return;
      }

      navUser.textContent = user.name || user.email + " (admin)";
      navUser.style.cursor = "pointer";
      navUser.addEventListener("click", function() {
        localStorage.removeItem("tm_token");
        localStorage.removeItem("tm_user");
        window.location.href = "admin.html";
      });

      document.getElementById("logoutBtn").addEventListener("click", function() {
        localStorage.removeItem("tm_token");
        localStorage.removeItem("tm_user");
        window.location.href = "admin.html";
      });

      // Tab switching
      document.querySelectorAll(".tab").forEach(function(tab) {
        tab.addEventListener("click", function() {
          document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
          document.querySelectorAll(".tab-content").forEach(function(tc) { tc.classList.remove("active"); });
          tab.classList.add("active");
          document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
          if (tab.dataset.tab === "db") loadDB();
        });
      });

      loadRequests();

      async function loadRequests() {
        try {
          var resp = await fetch("/api/admin/requests", {
            headers: { "Authorization": "Bearer " + token }
          });
          if (resp.status === 401 || resp.status === 403) {
            window.location.href = "admin.html";
            return;
          }
          var data = await resp.json();
          var reqs = data.requests || [];

          var pending = reqs.filter(function(r) { return r.status === "pending"; });
          var approved = reqs.filter(function(r) { return r.status === "approved"; });
          var denied = reqs.filter(function(r) { return r.status === "denied"; });

          document.getElementById("sPending").textContent = pending.length;
          document.getElementById("sApproved").textContent = approved.length;
          document.getElementById("sDenied").textContent = denied.length;
          document.getElementById("sTotal").textContent = reqs.length;

          var list = document.getElementById("requestsList");

          if (reqs.length === 0) {
            list.innerHTML = '<div class="empty-state"><h3>No trust requests yet</h3><p>When organizations submit trust requests, they will appear here for your review.</p></div>';
            return;
          }

          var html = "";
          if (pending.length > 0) {
            html += '<div class="section-label">Pending review (' + pending.length + ')</div>';
            pending.forEach(function(r) { html += card(r, true); });
          }
          if (approved.length > 0) {
            html += '<div class="section-label" style="margin-top:24px">Approved (' + approved.length + ')</div>';
            approved.forEach(function(r) { html += card(r, false); });
          }
          if (denied.length > 0) {
            html += '<div class="section-label" style="margin-top:24px">Denied (' + denied.length + ')</div>';
            denied.forEach(function(r) { html += card(r, false); });
          }

          list.innerHTML = html;

          list.querySelectorAll("[data-approve]").forEach(function(btn) {
            btn.addEventListener("click", function() { action(btn.dataset.approve, "approved"); });
          });
          list.querySelectorAll("[data-deny]").forEach(function(btn) {
            btn.addEventListener("click", function() { action(btn.dataset.deny, "denied"); });
          });
        } catch (err) {
          document.getElementById("requestsList").innerHTML = '<div class="empty-state"><h3>Connection failed</h3><p>Could not reach the server.</p></div>';
        }
      }

      function card(r, showActions) {
        var cls = r.status;
        var badgeCls = "badge-" + r.status;
        var statusText = r.status.charAt(0).toUpperCase() + r.status.slice(1);
        var accessColors = { summary: "var(--cyan)", full: "var(--green)", evidence: "#e6a817" };

        var h = '<div class="req-card ' + cls + '">';
        h += '<div class="req-top"><span class="req-org">' + esc(r.org_name) + '</span><span class="req-badge ' + badgeCls + '">' + statusText + '</span></div>';
        h += '<div class="req-grid">';
        h += field("Email", esc(r.email));
        h += field("Target Domain", esc(r.target_domain));
        h += field("Access Level", '<span style="color:' + (accessColors[r.access_level] || "var(--text)") + '">' + esc(r.access_level) + '</span>');
        h += field("Submitted", new Date(r.created_at).toLocaleString());
        h += '</div>';
        if (r.message) h += '<div class="req-msg">' + esc(r.message) + '</div>';
        if (showActions) {
          h += '<div class="req-actions">';
          h += '<button class="btn-approve" data-approve="' + r.id + '">Approve</button>';
          h += '<button class="btn-deny" data-deny="' + r.id + '">Deny</button>';
          h += '</div>';
        }
        h += '</div>';
        return h;
      }

      function field(label, value) {
        return '<div class="req-field"><label>' + label + '</label><span>' + value + '</span></div>';
      }

      function esc(s) {
        var d = document.createElement("div");
        d.textContent = s || "";
        return d.innerHTML;
      }

      async function action(id, status) {
        try {
          await fetch("/api/admin/requests/" + id, {
            method: "PUT",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ status: status })
          });
          loadRequests();
        } catch (err) {}
      }

      // Database viewer
      var dbData = null;
      var currentTable = null;

      async function loadDB() {
        try {
          var resp = await fetch("/api/admin/db", {
            headers: { "Authorization": "Bearer " + token }
          });
          var data = await resp.json();
          dbData = data.db;
          var tables = Object.keys(dbData);
          var nav = document.getElementById("tableNav");
          nav.innerHTML = tables.map(function(t) {
            var active = t === (currentTable || tables[0]) ? ' active' : '';
            return '<button class="' + active + '" data-table="' + t + '">' + t + ' (' + (dbData[t] ? dbData[t].length : 0) + ')</button>';
          }).join("");
          nav.querySelectorAll("button").forEach(function(btn) {
            btn.addEventListener("click", function() {
              nav.querySelectorAll("button").forEach(function(b) { b.classList.remove("active"); });
              btn.classList.add("active");
              currentTable = btn.dataset.table;
              renderTable(currentTable);
            });
          });
          if (!currentTable) currentTable = tables[0];
          if (currentTable) renderTable(currentTable);
        } catch (err) {
          document.getElementById("dbContent").innerHTML = '<div class="empty-state"><h3>Could not load database</h3><p>Make sure the server is running.</p></div>';
        }
      }

      function renderTable(name) {
        var rows = dbData[name] || [];
        var cols = rows.length > 0 ? Object.keys(rows[0]) : [];
        var html = '<div class="row-count">' + rows.length + ' row' + (rows.length !== 1 ? "s" : "") + '</div>';
        if (cols.length === 0) {
          html += '<div class="empty-state"><h3>Empty table</h3></div>';
        } else {
          html += '<div style="overflow-x:auto"><table class="db-table"><thead><tr>' + cols.map(function(c) { return '<th>' + c + '</th>'; }).join("") + '</tr></thead><tbody>';
          rows.forEach(function(r) {
            html += '<tr>' + cols.map(function(c) {
              var v = r[c];
              var s = v === null || v === undefined ? '<span style="color:#4a5a52">NULL</span>' : esc(String(v));
              return '<td title="' + esc(String(v || "")) + '">' + s + '</td>';
            }).join("") + '</tr>';
          });
          html += '</tbody></table></div>';
        }
        document.getElementById("dbContent").innerHTML = html;
      }
    })();
    </script>
  </body>
</html>
